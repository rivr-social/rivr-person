name: CI

on:
  push:
    branches: [main, dev, beta]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # A migration file absent from the Drizzle journal is never discovered by
      # the migrator: it passes review, passes tests against an already-migrated
      # database, and never runs. This repo had 20+ such files.
      - run: pnpm check:migrations
      - run: pnpm test:ci
